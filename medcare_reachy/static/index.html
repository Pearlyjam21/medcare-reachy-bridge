<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedCare Reachy</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>MedCare Reachy</h1>
    <p class="lede">Connect this robot to your MedAiCarePlus server. Pair the robot in the web app first:
      <em>Settings → Reachy robot → Pair</em>, then copy the robot key here.</p>

    <section aria-labelledby="status-title">
      <h2 id="status-title">Status</h2>
      <p id="state" class="state" role="status">Loading…</p>
      <p id="detail" class="muted"></p>
      <dl id="metrics"></dl>
      <button type="button" id="restart" class="secondary">Restart</button>
    </section>

    <section aria-labelledby="config-title">
      <h2 id="config-title">Connection</h2>
      <form id="config">
        <label>Server address
          <input name="app_url" type="url" placeholder="http://192.168.1.20:8001" autocomplete="off" required>
          <small>Your MedAiCarePlus server's device port on the home network. Never an internet address.</small>
        </label>
        <label>Robot key
          <input name="device_token" type="password" placeholder="rdv1.…" autocomplete="off">
          <small id="token-hint">Shown once when you pair the robot. Leave empty to keep the current key.</small>
        </label>
        <label>Language
          <select name="language">
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <label>Camera rate (frames per second)
          <input name="capture_fps" type="number" min="1" max="15" step="1" value="15">
          <small>Keep 15. Below 12 fps the server sends every dose to a family member to confirm. "Camera feed" above shows what the robot's camera actually delivers: Reachy Mini's own software caps it at 10 fps until it is raised when the app is deployed.</small>
        </label>
        <label class="check">
          <input name="checkin_ack" type="checkbox" checked>
          <span>Answer each pause, then say it is thinking
            <small>In a check-in chat, Reachy answers each pause at once with 「嗯」, then, once it has the patient's words, says a short phrase such as 「我再想一下喔。」 while it works out its reply.</small>
          </span>
        </label>
        <label class="check">
          <input name="checkin_gestures" type="checkbox" checked>
          <span>Move while thinking and speaking
            <small>In a check-in chat, Reachy tilts its head, turns slowly and moves its antennas while it prepares a reply, and moves its antennas while it speaks.</small>
          </span>
        </label>
        <label class="check">
          <input name="follow_face" type="checkbox" checked>
          <span>Follow the patient's face while a medicine is taken
            <small>From the prompt until the dose is resolved, Reachy turns its head to keep the patient's face in the middle of its camera. It holds still while a hand-to-mouth movement is being checked.</small>
          </span>
        </label>
        <label class="check">
          <input name="multimodal_emotion" type="checkbox" checked>
          <span>Sense emotion from face, voice and words while a dose is watched
            <small>The patient's expression, tone of voice and (in Chinese) words are combined into one emotion for the dose. Voice and words need the microphone consent; the models come from Hugging Face on first start.</small>
          </span>
        </label>
        <label>Where emotion is computed
          <select name="emotion_compute">
            <option value="auto">On the robot, laptop as fallback</option>
            <option value="robot">Always on the robot</option>
            <option value="laptop">Always on the laptop (server)</option>
          </select>
          <small>With the fallback, the robot hands over when it scores fewer than half the frames due, takes over half a second per score three times in a row, or fails three times; it tries again after a minute. On the laptop the robot only streams its camera.</small>
        </label>
        <button type="submit">Save and connect</button>
        <p id="form-error" class="error" role="alert"></p>
      </form>
    </section>
  </main>
  <script src="/static/main.js"></script>
</body>
</html>
