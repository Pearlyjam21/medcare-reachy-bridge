[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "medcare_reachy"
version = "0.8.0"
description = "Medication-time companion for Reachy Mini: reminds, prompts each medicine, and watches each dose (intake and emotion) on the robot itself, for a MedAiCarePlus server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    # Vision runs the MediaPipe models on ONNX Runtime (already a reachy-mini dependency): the MediaPipe library
    # itself can't load on the Wireless robot's Raspberry Pi 4 (its ARM64 builds need AES instructions -> SIGILL).
    "onnxruntime",
    "pillow>=10",
    "numpy",
    "httpx>=0.27",
    "faster-whisper>=1.1,<2",
    # The live chat's WebSocket (bridge/live.py); the robot's apps_venv has 15.0.1.
    "websockets>=15",
]
keywords = ["reachy-mini-app"]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."reachy_mini_apps"]
medcare_reachy = "medcare_reachy.main:MedcareReachy"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["medcare_reachy*"]

[tool.setuptools.package-data]
medcare_reachy = ["**/*"] # Also include all non-.py files (settings page, clip manifest, vision models)
