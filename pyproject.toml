[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "medcare_reachy"
version = "0.1.0"
description = "Medication-time companion for Reachy Mini: reminds, prompts each medicine and streams intake landmarks to a MedAiCarePlus server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    # 1.0.1 is the first release with a Linux aarch64 wheel (the Wireless robot's Raspberry Pi); it also
    # brings its own OpenCV build, so no separate opencv package is listed.
    "mediapipe>=1.0.1",
    "httpx>=0.27",
]
keywords = ["reachy-mini-app"]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."reachy_mini_apps"]
medcare_reachy = "medcare_reachy.main:MedcareReachy"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["medcare_reachy*"]

[tool.setuptools.package-data]
medcare_reachy = ["**/*"] # Also include all non-.py files (settings page, clip manifest)
